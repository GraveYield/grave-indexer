# Claims-artifact publication — DEDICATED workflow (D4, I-06 handoff).
# Logically separate from publish-console-snapshot.yml (ConsoleSnapshotV2
# pool-discovery): own stable ref (claims-artifact-prod), own pointer
# schema, own asset namespace. Implements the draft-first lifecycle from
# docs/CLAIMS_PUBLICATION.md via src/claimsPublishCli.ts:
# producer-run handoff (validate run identity + provenance + artifact
# bytes, READ-ONLY) → digest → draft release → upload → read-back
# verification → immutable publish → ONE ownership-checked stable-ref
# update → post-activation verification, with automatic ownership-checked
# rollback of the previous known-good pointer on any post-activation
# failure (I-05).
#
# I-06: the artifact is NOT taken from a filesystem path — a dispatch
# starts a fresh runner and a path is not proof of producer origin. The
# artifact is retrieved from an explicit, validated PRODUCER RUN in the
# producer repository (graveyield-protocol, where the Rust
# grave-snapshotter-cli lives) via the authenticated Actions artifacts
# API, then fully re-verified before any network write. The producer
# workflow is the COMPANION `claims-snapshot.yml` (name:
# grave-snapshotter-cli) in GraveYield/graveyield-protocol — a
# read-only, artifact-only validation producer that never creates a
# release, never moves a ref, and never signs or submits transactions.
# See docs/CLAIMS_PUBLICATION.md § "D3→D4 artifact handoff".
name: publish-claims-artifact

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: "Numeric ID of the producer run in GraveYield/graveyield-protocol that sealed the claims artifact (from its run URL)"
        required: true
        type: string
      source_commit:
        description: "The protocol commit the artifact was produced from (40-hex; must equal the producer run's head commit)"
        required: true
      producer_identity:
        description: "Producer identity recorded in the pointer (must be the pinned producer: grave-snapshotter-cli)"
        required: true
      producer_version:
        description: "Producer version/commit tag recorded in the pointer"
        required: true
      expected_pool:
        description: "Pool identity the artifact must carry (rejects a mismatched artifact before any side effect)"
        required: true

permissions:
  contents: write

# Round-2 finding 2 / I-05: publications are SERIALIZED — a second
# publication waits instead of racing the first one's stable-ref
# update/rollback. This protects THIS repo's runs against each other;
# EXTERNAL writers are handled by the ownership gate (a ref that changed
# hands is never clobbered — the run reports TERMINAL UNVERIFIED).
concurrency:
  group: claims-artifact-publication
  cancel-in-progress: false

env:
  # ── PINNED PRODUCER IDENTITY (I-06, P125-01) ─────────────────────────
  # These values are DECLARATIONS for the CLI; the actual trust boundary
  # is ENFORCED BY THE CONSUMER (src/claimsProducerHandoff.ts):
  #   TRUSTED_CLAIMS_PRODUCER_REPO          = GraveYield/graveyield-protocol
  #   TRUSTED_CLAIMS_PRODUCER_BRANCH        = main
  #   TRUSTED_CLAIMS_PRODUCER_WORKFLOW_PATH = .github/workflows/claims-snapshot.yml
  #   TRUSTED_CLAIMS_PRODUCER_WORKFLOW_NAME = grave-snapshotter-cli
  # The handoff resolves the workflow by PATH in the trusted repository's
  # registry, binds the run to its immutable numeric workflow id, and
  # verifies the run's GitHub-authoritative head_branch / head_repository
  # / repository against the trusted values. A dispatch input cannot
  # point the check at another repository, branch, or workflow — a value
  # here that disagrees with the consumer's pins fails closed before any
  # network call. GY_CLAIMS_PRODUCER_WORKFLOW must equal the exact
  # workflow `name` of the producer workflow in
  # GraveYield/graveyield-protocol that runs grave-snapshotter-cli and
  # uploads `claims-artifact.json` as a run artifact — the COMPANION
  # `claims-snapshot.yml` pins `name: grave-snapshotter-cli`; the value
  # below MUST stay in lock-step with it (enforced by
  # test/claimsReview.test.ts and test/claimsProducerHandoff.test.ts).
  GY_CLAIMS_PRODUCER_REPO: GraveYield/graveyield-protocol
  GY_CLAIMS_PRODUCER_WORKFLOW: grave-snapshotter-cli
  GY_CLAIMS_ARTIFACT_NAME: claims-artifact.json

jobs:
  publish-claims-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vendored SDK
        run: pnpm run build:sdk

      # I-06 pre-flight: resolve + verify the producer artifact with
      # READ-ONLY API calls (GET only) — run identity, workflow identity,
      # commit provenance, artifact presence/expiry/uniqueness, zip byte
      # length + CRC32, claims-grade integrity, pool identity. NO release,
      # tag, ref, or asset is touched in this step.
      #
      # I-06 CROSS-REPO AUTH: the producer run lives in
      # graveyield-protocol, and this repository's automatic GITHUB_TOKEN
      # CANNOT read another repository's Actions runs or artifacts. The
      # handoff therefore authenticates with GY_CLAIMS_PRODUCER_TOKEN —
      # an operator-provided fine-grained token scoped to actions:read on
      # GraveYield/graveyield-protocol, NOTHING more. The publication
      # writes use the automatic GITHUB_TOKEN (contents: write on THIS
      # repo); the two tokens are never swapped. The CLI wires the
      # producer token to GY_CLAIMS_PRODUCER_GITHUB_TOKEN.
      #
      # Round-2 finding 1: NO dispatch input is interpolated into a `run:`
      # script. Every input crosses into the shell ONLY as an environment
      # variable (GitHub expands `env:` values, never shell text) and is
      # consumed as a quoted "$VAR" — a value containing shell
      # metacharacters stays data, never code.
      - name: Verify the producer-run artifact (READ-ONLY handoff pre-flight)
        env:
          GY_CLAIMS_PRODUCER_GITHUB_TOKEN: ${{ secrets.GY_CLAIMS_PRODUCER_TOKEN }}
          GY_CLAIMS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMS_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          CLAIMS_SOURCE_COMMIT: ${{ inputs.source_commit }}
          CLAIMS_PRODUCER_IDENTITY: ${{ inputs.producer_identity }}
          CLAIMS_PRODUCER_VERSION: ${{ inputs.producer_version }}
          CLAIMS_EXPECTED_POOL: ${{ inputs.expected_pool }}
        run: |
          pnpm exec tsx src/claimsPublishCli.ts \
            --handoff-only \
            --repo "$GITHUB_REPOSITORY" \
            --producer-run-id "$CLAIMS_PRODUCER_RUN_ID" \
            --producer-repo "$GY_CLAIMS_PRODUCER_REPO" \
            --producer-workflow "$GY_CLAIMS_PRODUCER_WORKFLOW" \
            --artifact-name "$GY_CLAIMS_ARTIFACT_NAME" \
            --source-commit "$CLAIMS_SOURCE_COMMIT" \
            --producer-identity "$CLAIMS_PRODUCER_IDENTITY" \
            --producer-version "$CLAIMS_PRODUCER_VERSION" \
            --expected-pool "$CLAIMS_EXPECTED_POOL"

      - name: Publish (draft-first, immutable, stable-pointer promotion)
        env:
          GY_CLAIMS_PRODUCER_GITHUB_TOKEN: ${{ secrets.GY_CLAIMS_PRODUCER_TOKEN }}
          GY_CLAIMS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMS_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          CLAIMS_SOURCE_COMMIT: ${{ inputs.source_commit }}
          CLAIMS_PRODUCER_IDENTITY: ${{ inputs.producer_identity }}
          CLAIMS_PRODUCER_VERSION: ${{ inputs.producer_version }}
          CLAIMS_EXPECTED_POOL: ${{ inputs.expected_pool }}
        run: |
          pnpm exec tsx src/claimsPublishCli.ts \
            --repo "$GITHUB_REPOSITORY" \
            --producer-run-id "$CLAIMS_PRODUCER_RUN_ID" \
            --producer-repo "$GY_CLAIMS_PRODUCER_REPO" \
            --producer-workflow "$GY_CLAIMS_PRODUCER_WORKFLOW" \
            --artifact-name "$GY_CLAIMS_ARTIFACT_NAME" \
            --source-commit "$CLAIMS_SOURCE_COMMIT" \
            --producer-identity "$CLAIMS_PRODUCER_IDENTITY" \
            --producer-version "$CLAIMS_PRODUCER_VERSION" \
            --expected-pool "$CLAIMS_EXPECTED_POOL"

      - name: Report
        if: always()
        env:
          GITHUB_JOB_STATUS: ${{ job.status }}
        run: 'echo "claims publication job finished (status: $GITHUB_JOB_STATUS)"'
