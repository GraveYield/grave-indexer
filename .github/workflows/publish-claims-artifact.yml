# Claims-artifact publication — DEDICATED workflow (D4).
# Logically separate from publish-console-snapshot.yml (ConsoleSnapshotV2
# pool-discovery): own stable ref (claims-artifact-prod), own pointer
# schema, own asset namespace. Implements the draft-first lifecycle from
# grave-indexer docs/CLAIMS_PUBLICATION.md via src/claimsPublishCli.ts:
# validate → digest → draft release → upload → read-back verification →
# immutable publish → ONE atomic stable-ref move → post-activation
# verification, with automatic verified rollback of the previous
# known-good pointer on any post-activation failure.
name: publish-claims-artifact

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: "Path to the D3 claims artifact (claims-artifact.json)"
        required: true
      source_commit:
        description: "The protocol commit the artifact was produced from (40-hex)"
        required: true
      producer_identity:
        description: "Producer identity (e.g. grave-snapshotter-cli)"
        required: true
      producer_version:
        description: "Producer version/commit tag"
        required: true

permissions:
  contents: write

# Review finding 2: publications are SERIALIZED — a second publication
# waits instead of racing the first one's stable-ref move/rollback.
concurrency:
  group: claims-artifact-publication
  cancel-in-progress: false

jobs:
  publish-claims-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vendored SDK
        run: pnpm run build:sdk

      # Review finding 1: NO workflow_dispatch input is interpolated into a
      # `run:` script. Every input crosses into the shell ONLY as an
      # environment variable (GitHub expands `env:` values, never shell
      # text) and is consumed as a quoted "$VAR" — a value containing shell
      # metacharacters stays data, never code.
      - name: Verify the artifact bundle BEFORE any network write
        env:
          CLAIMS_ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          node --import tsx -e "
            const { verifyClaimsArtifactBytes } = await import('./src/claimsArtifact.js');
            const fs = await import('node:fs');
            const bytes = fs.readFileSync(process.argv[1]);
            const v = verifyClaimsArtifactBytes(bytes);
            console.log('claims-grade artifact verified:', v.rootHex.slice(0, 16) + '…', 'slot', v.snapshotSlot);
          " "$CLAIMS_ARTIFACT_PATH"

      - name: Publish (draft-first, immutable, stable-pointer promotion)
        env:
          GY_CLAIMS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMS_ARTIFACT_PATH: ${{ inputs.artifact_path }}
          CLAIMS_SOURCE_COMMIT: ${{ inputs.source_commit }}
          CLAIMS_PRODUCER_IDENTITY: ${{ inputs.producer_identity }}
          CLAIMS_PRODUCER_VERSION: ${{ inputs.producer_version }}
        run: |
          pnpm run claims:publish -- \
            --repo "$GITHUB_REPOSITORY" \
            --artifact "$CLAIMS_ARTIFACT_PATH" \
            --source-commit "$CLAIMS_SOURCE_COMMIT" \
            --producer-identity "$CLAIMS_PRODUCER_IDENTITY" \
            --producer-version "$CLAIMS_PRODUCER_VERSION"

      - name: Report
        if: always()
        env:
          GITHUB_JOB_STATUS: ${{ job.status }}
        run: 'echo "claims publication job finished (status: $GITHUB_JOB_STATUS)"'
