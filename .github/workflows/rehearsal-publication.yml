      # The happy path proves the rollback API OPERATIONS work; this scenario
      # proves the FAILURE-TRIGGERED rollback path works: a deliberate,
      # controlled failure AFTER the stable reference has verifiably moved
      # (an explicit `exit 1` — never an accidental network error, an
      # invalid credential, or a destructive action against unrelated
      # resources) exercises the SAME `if: failure()` gating production
      # uses, INCLUDING the compare-before-rollback guard. The job
      # conclusion for this scenario is EXPECTED to be failure and the
      # summary below must never read as a successful publication.
      - name: INJECT a controlled post-activation failure (deliberate — the ref has verifiably moved)
        if: env.SCENARIO == 'post-activation-failure'
        id: inject_failure
        run: |
          # Pre-injection proof: the dedicated reference is confirmed to
          # point at THIS run's activated tag object (read-back above), so
          # the injection happens strictly AFTER the ref has moved.
          sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod" | jq -r '.object.sha // ""')
          if [ "$sha" != "$NEW_TAG_OBJECT_SHA" ]; then
            echo "INJECTION PRECONDITION FAILED: the ref does not point at this run's tag object ('$sha' vs '$NEW_TAG_OBJECT_SHA') — refusing to inject outside the required state"; exit 1
