                  echo "## OPERATOR INTERVENTION REQUIRED — failure-triggered rollback REFUSED"
                  echo "This run's captured tag-object sha (NEW_TAG_OBJECT_SHA) is unusable (\`${NEW_TAG_OBJECT_SHA:-<empty>}\`) — identity cannot be established; fail closed, no mutation."
                  echo "Observed live ref sha: \`$sha\`. Message or payload equality NEVER proves tag-object identity."
