            echo "## Phase 2 — INJECTED post-activation failure (deliberate, controlled)"
            echo "- injected AFTER \`refs/tags/console-snapshot-prod\` verifiably pointed at this run's tag object \`$NEW_TAG_OBJECT_SHA\`"
            echo "- mechanism: an explicit \`exit 1\` below — no network error, no credential problem, no destructive action"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::INJECTED POST-ACTIVATION FAILURE (controlled, deliberate — scenario post-activation-failure; the failure-triggered rollback path must now run)"
          echo "INJECTED POST-ACTIVATION FAILURE: activation had completed and was verified; this explicit exit triggers the failure-triggered rollback path"
          exit 1
      - name: Failure-triggered rollback (compare-before-rollback → restore → verify — the SAME failure() gating production uses)
        # NINTH-ROUND CORRECTION (review Finding 3): this step is gated on
        # `if: failure()` exactly like the production rollback steps — it
        # runs because the injected step FAILED, not because it was
        # manually invoked. It applies the same compare-before-rollback
        # protection required in production Finding 1 — including the
        # TENTH-ROUND ownership-identity rule: the rollback mutation is
        # permitted ONLY when the live ref's object.sha EXACTLY equals
        # this run's captured NEW_TAG_OBJECT_SHA. Pointer-message equality
        # (even byte-for-byte) is NOT an ownership test — a different
        # writer can mint a DISTINCT annotated tag object carrying an
        # identical pointer JSON — and if NEW_TAG_OBJECT_SHA is absent,
        # empty, or malformed, identity cannot be established and the
        # step FAILS CLOSED without mutation. The LIVE remote ref
        # is classified BEFORE any mutation (CASE A original state intact →
        # no mutation; CASE B this run's pointer is live → restore; CASE C
        # moved independently → refuse + OPERATOR INTERVENTION; CASE D
        # unreadable → fail closed). It then restores the previous pointer
