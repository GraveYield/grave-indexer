            code_after=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod")
            if [ "$code_after" != "404" ]; then
              echo "SAFETY FAILURE: the ref read returned HTTP $code_after after the first-publication rollback (expected 404)"; exit 1
            fi
            rollback_ok=true
            {
              echo "## Phase 4 — restored-state verification: PASS"
              echo "- the ref read-back returned a genuine HTTP 404 — the absent pre-publication state is restored"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rollback_ok" != "true" ]; then
            echo "ROLLBACK UNVERIFIED"; exit 1
          fi
          echo "failure-triggered rollback VERIFIED: the restored pointer and asset chain were proven from the remote"
      - name: Rehearsal result (post-activation-failure)
        # The job conclusion for this scenario is EXPECTED to be failure —
        # the injected failure is deliberately NOT reported as an ordinary
        # successful publication. This summary runs always() so the four
        # phases are reported distinctly even if the rollback itself failed.
        if: always() && env.SCENARIO == 'post-activation-failure'
        run: |
          {
            echo "## Rehearsal scenario \`post-activation-failure\` — run conclusion: EXPECTED FAILURE (injected)"
            echo "- this run is NOT a successful publication; the failure was injected deliberately after a verified activation"
            echo "- phase report:"
            echo "  1. publication + verification before injection: see 'Phase 1' above (must be PASS)"
            echo "  2. injected post-activation failure: see 'Phase 2' above (deliberate \`exit 1\` after the ref verifiably moved)"
            echo "  3. failure-triggered rollback (compare-before-rollback → restore): see 'Phase 3' above"
            echo "  4. restored-state verification: see 'Phase 4' above (verify-stable identity chain, or a genuine 404 for first publication)"
