          echo "verified: re-activation of $TAG confirmed through the full identity chain (POST path exercised when the ref was absent; PATCH path when it existed)"
      - name: Rehearsal result (happy)
        if: env.SCENARIO == 'happy'
        run: |
          {
            echo "- versioned release created (\`--latest=false\`) + uploaded: \`$TAG\`"
            echo "- same-release asset verification (digests + lengths): PASS"
            echo "- pointer build + strict pointer validation: PASS"
            echo "- annotated tag object + dedicated ref create-or-update: PASS"
            echo "- read-back + full identity chain (\`verify-stable\`): PASS"
            echo "- unrelated-release probe: PASS"
            echo "- rehearsal OK (dedicated stable-reference architecture)"
          } >> "$GITHUB_STEP_SUMMARY"
