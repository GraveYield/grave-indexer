                echo "COMPARE-BEFORE-ROLLBACK FAILED: this run's captured tag-object sha is unusable — identity cannot be established; fail closed, no mutation"
                exit 1
              fi
              if [ "$sha" = "$NEW_TAG_OBJECT_SHA" ]; then
                echo "compare-before-rollback OK: the stable ref still points EXACTLY at this run's activated tag object (strict sha identity) — the failure-triggered rollback may proceed"
              else
                {
                  echo
                  echo "## OPERATOR INTERVENTION REQUIRED — failure-triggered rollback REFUSED"
                  echo "The stable ref points at \`$sha\` (tag '${observed_tag:-<not a pointer tag>}'), not at this run's activated tag object — it moved independently."
                  echo "Even if that object's message equals this run's pointer JSON byte-for-byte, message equality is NOT identity: the rollback will NOT overwrite a pointer that moved independently (documented single-writer assumption)."
                  echo "This run's pointer JSON (for operator comparison):"
                  echo '```json'
                  echo "$POINTER_JSON"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                echo "COMPARE-BEFORE-ROLLBACK FAILED: the ref moved independently; refusing to overwrite it"
                exit 1
              fi
              ;;
            404)
              # This step can only be reached AFTER the injected-failure
              # precondition verified that the ref pointed at THIS run's
              # activated tag object — a 404 here means the reference was
              # DELETED independently. Absence is an unexpected,
              # independently created state: refuse (no mutation), never
              # interpret it as the original pre-activation state.
              {
                echo
                echo "## OPERATOR INTERVENTION REQUIRED — failure-triggered rollback REFUSED"
                echo "The stable ref is ABSENT, but this run's activation was verified before the injection (the ref pointed at \`${NEW_TAG_OBJECT_SHA:-<unusable>}\`)."
                echo "The reference was deleted independently — the rollback will NOT interpret absence as the original state."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "COMPARE-BEFORE-ROLLBACK FAILED: the ref is absent after a verified activation — the reference moved independently; refusing a blind recreation"
              exit 1
