          gh release create "$PROBE_TAG" --repo "$REPO" --target "$CHECKOUT_SHA" --latest \
            --title "Rehearsal unrelated release probe" \
            --notes "Rehearsal: proves an unrelated release (even one taking the repo-wide latest designation) cannot move the dedicated stable reference."
          node --import tsx/esm src/cli.ts stable-pointer-current "$REPO" > /tmp/sp-probe.out
          probe_ptr_tag=$(sed -n 's/^tag=//p' /tmp/sp-probe.out)
          if [ "$probe_ptr_tag" != "$TAG" ]; then
            echo "SAFETY FAILURE: the dedicated stable reference moved to '$probe_ptr_tag' after an unrelated release took the latest designation"; exit 1
          fi
          node --import tsx/esm src/cli.ts verify-stable "$REPO" --expected-tag "$TAG"
          gh release delete "$PROBE_TAG" --repo "$REPO" --yes --cleanup-tag
          {
            echo "- outcome: an unrelated release (which TOOK the repo-wide latest designation) did NOT move \`refs/tags/console-snapshot-prod\`; probe release cleaned up"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verified: the dedicated stable reference still names $TAG after an unrelated release took the repo-wide latest designation"
      - name: Rollback drill — restore the previous pointer (or delete the first-publication ref)
        if: env.SCENARIO == 'happy'
