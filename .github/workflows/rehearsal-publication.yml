            fi
            echo "rollback drill: restoring the previous pointer ($PRIOR_TAG)"
            old_sha=$(gh api --method POST "repos/$REPO/git/tags" \
              -f tag="console-snapshot-prod" \
              -f object="$PRIOR_COMMIT" \
              -f type="commit" \
              -f message="$PRIOR_POINTER_JSON" \
              --jq '.sha')
            gh api --method PATCH "repos/$REPO/git/refs/tags/console-snapshot-prod" -f sha="$old_sha" -F force=true
