          PRIOR_KIND: ${{ steps.rollback.outputs.prior_kind }}
          PRIOR_TAG: ${{ steps.rollback.outputs.prior_tag }}
          PRIOR_POINTER_JSON: ${{ steps.rollback.outputs.prior_pointer_json }}
          PRIOR_COMMIT: ${{ steps.rollback.outputs.prior_source_commit }}
          NEW_TAG_OBJECT_SHA: ${{ env.NEW_TAG_OBJECT_SHA }}
          POINTER_JSON: ${{ env.POINTER_JSON }}
