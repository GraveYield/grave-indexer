            404)
              echo "first publication: CREATE the dedicated reference"
              gh api --method POST "repos/$REPO/git/refs" \
                -f ref="$STABLE_REF" \
                -f sha="$new_sha"
              ;;
            200)
              echo "subsequent publication: MOVE the dedicated reference with ONE atomic PATCH"
              gh api --method PATCH "repos/$REPO/git/refs/tags/console-snapshot-prod" \
                -f sha="$new_sha" \
                -F force=true
              ;;
