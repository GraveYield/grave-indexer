        # and verifies the complete restored pointer and asset chain
        # (verify-stable, or a genuine HTTP 404 for the first-publication
        # case). The rollback re-uses the prior pointer state recorded at
        # drill start (steps.rollback) — or, explicitly, the absent
        # first-publication state.
