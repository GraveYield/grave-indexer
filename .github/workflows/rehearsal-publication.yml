          esac
          # Read back and verify the reference points at the expected tag
          # object in BOTH reactivation paths.
          sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod" | jq -r '.object.sha // ""')
          if [ "$sha" != "$new_sha" ]; then
            echo "REACTIVATION READ-BACK MISMATCH: the stable ref resolves to '$sha', expected '$new_sha'"; exit 1
          fi
