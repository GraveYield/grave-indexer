            200)
              echo "reactivation onto an EXISTING reference: PATCH repos/$REPO/git/refs/tags/console-snapshot-prod"
              gh api --method PATCH "repos/$REPO/git/refs/tags/console-snapshot-prod" \
                -f sha="$new_sha" \
                -F force=true
