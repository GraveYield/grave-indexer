          esac
          echo "activation issued: $STABLE_REF -> $new_sha (pointer for $TAG)"
      - name: Read back the reference and the tag object (the ref MUST name the created pointer)
        if: env.SCENARIO == 'happy' || env.SCENARIO == 'post-activation-failure'
        run: |
          sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod" | jq -r '.object.sha // ""')
          if [ "$sha" != "$NEW_TAG_OBJECT_SHA" ]; then
            echo "READ-BACK MISMATCH: the stable ref resolves to '$sha', expected the created object '$NEW_TAG_OBJECT_SHA'"; exit 1
          fi
          message=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/tags/$NEW_TAG_OBJECT_SHA" | jq -r '.message // ""')
          if [ "$message" != "$POINTER_JSON" ]; then
            echo "READ-BACK MISMATCH: the activated tag object's message does not equal the validated pointer JSON"; exit 1
          fi
          echo "read-back verified: $STABLE_REF -> $NEW_TAG_OBJECT_SHA (pointer for $TAG)"
