          # publication (CREATE the ref), 200 = exists (PATCH the ref),
          # anything else = gate failure (abort).
          code=$(curl -sS -o /tmp/stableref-pre.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod")
