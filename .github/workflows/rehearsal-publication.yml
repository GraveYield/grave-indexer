          # ── Compare-before-rollback: classify the LIVE remote state ──
          # OWNERSHIP IDENTITY RULE (tenth round): the rollback mutation is
          # permitted ONLY when the live ref's object.sha EXACTLY equals
          # this run's captured NEW_TAG_OBJECT_SHA. Pointer-message
          # equality is NOT an ownership test — a different writer can
          # mint a DISTINCT annotated tag object whose message is
          # byte-for-byte identical to this run's POINTER_JSON and move
          # the ref to it. If NEW_TAG_OBJECT_SHA is absent, empty or
          # malformed, identity cannot be established: fail closed, no
          # mutation.
          code=$(curl -sS -o /tmp/fr-ref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod") || code="transport-error"
          case "$code" in
            200)
              sha=$(jq -r '.object.sha // ""' /tmp/fr-ref.json)
              case "$sha" in
                [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
                *) echo "COMPARE-BEFORE-ROLLBACK FAILED (CASE D): the stable-ref read returned an unusable object.sha ('$sha') — the remote state cannot be established; fail closed, no mutation"
