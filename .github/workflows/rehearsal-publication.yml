        # of the ACTUAL reference state. After a first-publication rollback
        # drill the ref was DELETED — PATCH repos/<repo>/git/refs/tags/
        # console-snapshot-prod requires an EXISTING ref and would fail.
        # The three-way gate (identical to the activation step) decides:
        # 404 = the ref is absent → CREATE it (POST repos/$REPO/git/refs);
        # 200 = the ref exists → MOVE it (PATCH, force); anything else =
        # gate failure (abort — never guess). The resulting reference is
        # read back and verified against the expected annotated tag object
        # in BOTH branches, and the full production identity chain
        # (verify-stable) confirms the pointer end-to-end.
        run: |
          new_sha=$(gh api --method POST "repos/$REPO/git/tags" \
            -f tag="console-snapshot-prod" \
            -f object="$CHECKOUT_SHA" \
            -f type="commit" \
            -f message="$POINTER_JSON" \
            --jq '.sha')
          code=$(curl -sS -o /tmp/stableref-react.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod")
