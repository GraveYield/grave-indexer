            # never by the DELETE command's own exit status.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod")
            if [ "$code" != "404" ]; then
              echo "SAFETY FAILURE: the stable ref read returned HTTP $code after the first-publication rollback (expected 404)"; exit 1
