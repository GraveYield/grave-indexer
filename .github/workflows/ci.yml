name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + typecheck + unit battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build vendored SDK (pinned protocol submodule)
        run: pnpm run build:sdk
      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.typecheck.json --noEmit
      - name: Offline test battery (unit + integration)
        run: pnpm run test:offline

  devnet-smoke:
    name: devnet evidence-path smoke (read-only + simulation)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:sdk
      # Mirrors the protocol repo's convention: the smoke runs in
      # push-triggered CI with the public devnet endpoint. Read-only RPC
      # plus simulateTransaction — no keys, no state mutations, no funding.
      - name: Devnet evidence-path smoke
        run: pnpm run smoke:devnet
        env:
          DEVNET_RPC_URL: https://api.devnet.solana.com
