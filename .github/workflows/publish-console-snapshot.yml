name: publish-console-snapshot

# Manual-only ConsoleSnapshot publication (GY-M1-INT-001 §4, §8; PR #5
# remediation — independent review Tasks 1-5, Task 1 corrected FOUR times).
#
# TRIGGER: `workflow_dispatch` ONLY. No schedule, no cron, no push, no
# pull_request publication — a production snapshot is an explicit,
# auditable operator decision.
#
# EXECUTION RESTRICTION (review Task 1): the workflow is restricted to
# the `main` branch at TWO independent layers:
#   1. a job-level `if: github.ref == 'refs/heads/main'` condition on
#      ALL SEVEN jobs — a dispatch against any other ref skips every job
#      outright, so release-writing steps are unreachable;
#   2. an explicit guard step at the top of each job that re-checks
#      GITHUB_REF == refs/heads/main (defense in depth; also covers a
#      ref given as a short name or a tag — `refs/heads/main` is matched
#      EXACTLY, so `main-tag`, `refs/tags/main` or any other ref fails).
# Verified repository configuration (2026-11-21, REST API): the default
# branch is NOT covered by a classic branch-protection rule; the active
# repository ruleset ("enhancing indexer") enforces deletion- and
# non-fast-forward protection plus code-quality checks on all branches
# but does NOT require pull requests. Restricting this workflow to
# `refs/heads/main` therefore limits WHO dispatches production
# publication to those with push access to main, but the owner must
# still add a pull-request requirement on `main` (external repository
# configuration; see docs/SNAPSHOT_PUBLICATION.md §8) — this workflow
# cannot configure repository protection itself.
#
# SOURCE COMMIT FIDELITY (review Task 1 #4): every repository-checkout
# job checks out the EXACT commit Actions selected (`ref:
# ${{ github.sha }}`) and asserts `git rev-parse HEAD` equals that SHA.
# The provenance sidecar's `indexerSourceCommitSha` is `git rev-parse
# HEAD` from this checkout, so it provably refers to the actual reviewed
# commit; the release is created with `--target ${{ github.sha }}` — the
# same asserted commit.
#
# JOB SEPARATION — WRITE-TOKEN ISOLATION (review Task 1 #5, THIRD-ROUND
# CORRECTION): the first remediation attached GH_TOKEN per-step but kept
# a job-level `permissions: contents: write`; the second remediation
# removed checkout/setup-node/pnpm from the privileged job but STILL ran
# repository-built code (the release-ops bundle, provenance parsing)
# inside the write-permission job — and GitHub documents that the
# `github.token` context is write-capable for EVERY step of a job whose
# `permissions` grant write, whether or not an explicit GH_TOKEN env is
# attached. The corrected structure makes the write-capable token
# UNREACHABLE to custom code by construction:
#
#   generate (read-only)     build + generate + validate + stage the
#                            artifact bundle, upload it as a run-scoped
#                            artifact.
#   verify (read-only)       INDEPENDENTLY re-download the staged bundle,
#                            re-verify schema-v2 + integrity against the
#                            downloaded bytes, and compile the release-ops
#                            CLI (src/releaseOpsCli.ts) into a SINGLE
#                            self-contained bundle with ZERO npm runtime
#                            dependencies (`pnpm run bundle:release-ops`,
#                            ~11 KB, `node:` builtins only — pinned by
#                            test/releaseOpsCliBundle.test.ts).
#   publish (READ-ONLY)      ALL repository-built code and ALL
#                            discovery/gating logic run here, under an
#                            EXPLICIT job-level `permissions:
#                            contents: read`: checksum belt over the
#                            downloaded bytes, provenance tag parsing +
#                            strict shape validation, the fail-closed
#                            tag/release collision gates, and the
#                            hardened `stable-pointer-current` stable-ref
#                            discovery (custom bundle — receives the
#                            READ-ONLY workflow token only, per the
#                            review requirement that discovery use a
#                            read-only credential or a read-only job).
#                            No step in this job holds write permission.
#   release (contents:read;  THE ONLY release-creation job, and it
#   PAT on mutations)        contains ZERO custom code: no checkout, no
#                            setup-node, no pnpm, no dependency
#                            installation, no node invocation, no
#                            repository script, no downloaded-code
#                            execution. Its only action is
#                            actions/download-artifact (artifact-scoped
#                            runtime token, no github.token input); its
#                            only commands are the authenticated
#                            read-only collision gate (curl, automatic
#                            token) and TWO pinned GitHub CLI
#                            release-mutation invocations (`gh release
#                            create --latest=false --target <asserted
#                            sha>` and `gh release upload`) which use
#                            the `GY_RELEASE_PAT` secret as a STEP-level
#                            env — the only place the write-capable
#                            credential exists, never job/workflow level.
#   verify-versioned         READ-ONLY same-release roundtrip gate
#   (read-only)              between upload and promotion: the three
#                            assets of THAT EXACT versioned release are
#                            verified through the AUTHENTICATED API path
#                            with the prebuilt zero-dependency bundle,
#                            which receives the READ-ONLY workflow token
#                            (a private repository's release assets 404
#                            for unauthenticated requests). The stable
#                            pointer cannot move until this job is green.
#   promote (contents:read)  THE activation job: the pointer-build
#                            output is re-validated (jq, token-free),
#                            the current stable ref is re-read through a
#                            READ-ONLY three-way gate, and exactly ONE
#                            privileged step performs the mutation —
#                            create the new ANNOTATED TAG OBJECT
#                            (`gh api POST /git/tags`, message = the
#                            pointer JSON) + move the ref
#                            (`gh api PATCH /git/refs`, force) —
#                            followed by a READ-ONLY read-back
#                            verification and, on failure, a rollback
#                            step. Zero custom code, no checkout, no
#                            node; the release-write PAT exists ONLY as
#                            the step-level env of the mutation and
#                            rollback steps.
#   verify-stable (read-only) the post-activation stable-reference gate:
#                            the FULL identity chain (ref → tag object →
#                            pointer → versioned release record → its
#                            three assets → checksum + provenance +
#                            pointer digests), run with the READ-ONLY
#                            workflow token from a full repository
#                            checkout (the code it runs is the reviewed
#                            commit's own).
#
# FOURTH-ROUND CORRECTION — CREDENTIAL ISOLATION VIA A DEDICATED PAT:
# the owner provisioned a fine-grained PAT exclusively for this
# repository and stored it as the Actions secret `GY_RELEASE_PAT`.
# GitHub's automatic GITHUB_TOKEN can only obtain `contents: write`
# through a job-level `permissions` grant — there is no per-step
# permission knob, so a write-capable automatic token can never be
# narrower than a whole job. The final structure therefore NEVER grants
# the automatic token write anywhere:
#
#   * EVERY job declares `contents: read` (explicitly at job level, not
#     only via the workflow default) — the automatic GITHUB_TOKEN is
#     READ-ONLY in all seven jobs by construction;
#   * the ONLY write-capable credential in the entire workflow is the
#     owner-provisioned `GY_RELEASE_PAT` secret, exposed as STEP-LEVEL
#     env on EXACTLY the trusted mutation steps (the create+upload step
#     of `release`, the stable-ref activation step of `promote`, and the
#     rollback step of `promote`) — never at workflow or job level,
#     never to any step that checks out code, installs dependencies,
#     runs node/scripts or downloads artifacts;
#   * the `release` and `promote` jobs still contain ZERO custom code
#     (no checkout, no setup-node, no pnpm, no node, no repository or
#     artifact-executed code) — pinned by test/publishWorkflow.test.ts.
#   Trust assumption (owner-side, not verifiable from the workflow): the
#   PAT's value is never visible here; its narrow scope (fine-grained,
#   this repository only, release-write) is the owner's provisioning
#   decision. GitHub masks the secret value in run logs.
#
# TRUST CHAIN FOR THE PRIVILEGED JOBS: the bytes they upload were
# schema- and integrity-verified by BOTH read-only jobs; the release job
# re-checks the checksum file over its own downloaded bytes
# (`sha256sum -c`, pure coreutils) and re-validates the tag shape before
# anything is published; the tag crossing job boundaries is validated
# AGAIN in every consuming job; `verify-versioned` verifies the released
# bytes through the AUTHENTICATED API path BEFORE `promote` may run
# (needs: chain enforces the order); `verify-stable` re-verifies the
# stable pointer after activation.
#
# STABLE REFERENCE — DEDICATED `console-snapshot-prod` REF (SIXTH-ROUND
# CORRECTION — OWNER-SELECTED ARCHITECTURE): the production stable
# reference is the git ref `refs/tags/console-snapshot-prod` — an
# ANNOTATED tag whose tag-object MESSAGE carries the stable-pointer JSON
# (graveyield.console-snapshot-stable-pointer.v1) naming ONE immutable
# versioned release (tag + source commit + per-asset SHA-256 digests and
# lengths). The production path NEVER depends on the repo-wide "latest"
# designation — an unrelated release taking it cannot move the stable
# reference. The pointer BYTES are never copied onto the stable
# reference: the snapshot/provenance/checksum live exclusively on
# immutable versioned releases (`--latest=false` on creation), so the
# pointer cannot become a second mutable copy of the payload.
# Activation = create a NEW immutable tag object (POST /git/tags) and
# move the ref with ONE atomic update (PATCH /git/refs, force) — a
# reader of the ref sees the old pointer or the new pointer, never a
# missing window or a partial state (the atomicity the previously
# rejected asset-clobber design could not provide). The PREVIOUS pointer
# content is recorded BEFORE the mutation (run summary + job output +
# the new pointer's previous* fields); rollback re-creates the previous
# pointer object and re-points the ref, verified by read-back. A failed
# run at ANY point before the atomic ref move leaves the stable
# reference untouched; a failed POST-activation verification triggers
# the rollback step, and an unverifiable rollback fails LOUDLY (the run
# reports the state as unverified — never claims restoration without
# evidence).
# PRODUCTION RESOLUTION (consumers; requires the documented Console-side
# change — see docs/SNAPSHOT_PUBLICATION.md): GET
#   https://api.github.com/repos/<repo>/git/ref/tags/console-snapshot-prod
# → GET .../git/tags/<object.sha> → parse the pointer from `message` →
# fetch the assets from
#   https://github.com/<repo>/releases/download/<pointer.versionedTag>/<asset>
# and verify the SHA-256 digests against the pointer before use.
#
# WHAT IT DOES (in order, fail-closed):
#   1. generate — build the indexer (frozen lockfile), run
#      `publish-snapshot`: real discovery with the verified RPC-level
#      pc_mint==WSOL memcmp filter, strict schema-v2 validation,
#      provenance sidecar + SHA-256 checksum derived from the exact
#      artifact bytes, completeness gate (discovery + enrichment).
#      NOTHING is published unless this job is green.
#   2. verify — download the staged artifact, RE-VERIFY schema-v2 and
#      integrity against the downloaded bytes, build the zero-dependency
#      release-ops bundle from the asserted commit.
#   3. publish (read-only) — download bundle + release-ops CLI, re-check
#      the checksum over the downloaded bytes, parse + strictly validate
#      the versioned tag from provenance, abort on an existing versioned
#      tag or release (immutability; never clobber; BOTH gates
#      distinguish "absent" from "exists" from "gate failed" — an API
#      failure is NEVER treated as "absent"), record the current stable
#      pointer through the hardened `stable-pointer-current` gate with the
#      READ-ONLY token (only a genuine HTTP 404 means "no stable
#      reference yet"; auth/permission/rate-limit/outage/malformed failures
#      abort) and expose the tag + rollback pointer as job outputs.
#   4. release (privileged, zero custom code) — re-check the checksum,
#      re-validate the tag shape, re-run the three-way tag-collision
#      gate immediately before the mutation, create the versioned
#      release with --latest=false targeting the asserted commit, upload
#      the three assets. GitHub itself fails the create (422) if a
#      release already exists for the tag and fails the upload if an
#      asset already exists — both abort the run BEFORE activation.
#   5. verify-versioned (read-only, no token) — verify all three assets
#      of THAT EXACT VERSIONED RELEASE through its tag URLs with
#      same-release cross-checks (`verify-release-assets --scope
#      versioned`).
#   6. promote (privileged, pinned gh api mutations, zero custom code) —
#      activate the DEDICATED stable reference: create the NEW annotated
#      pointer tag object, then move refs/tags/console-snapshot-prod
#      with ONE repository-qualified ref-update request (PATCH
#      repos/<repo>/git/refs/tags/console-snapshot-prod, force). Only
#      reached when every prior job is green AND the three-way
#      stable-ref gate has read the current ref state. An
#      activation-start marker is written immediately BEFORE the first
#      mutation; the rollback step runs only when that marker exists AND
#      the run has failed — never for a failure that happened before
#      activation was attempted.
#   7. verify-stable (read-only) — the DEDICATED stable reference must
#      resolve to a pointer naming exactly the activated versioned tag
#      AND that release must serve one complete verified artifact set
#      (full identity chain via `verify-stable --expected-tag`); then
#      the publication summary (incl. the rollback pointer) is written.
#
# PERMISSIONS: least privilege — the workflow default is `contents:
# read`, and EVERY ONE of the seven jobs declares `contents: read`
# EXPLICITLY at job level: the automatic GITHUB_TOKEN is READ-ONLY in
# every job of this workflow, and no job-level grant can elevate it.
# The ONLY write-capable credential is the `GY_RELEASE_PAT` secret on
# the two trusted release-mutation steps (step-level env only). An
# untrusted pull_request context cannot reach any step:
# workflow_dispatch is the only trigger, all seven jobs are gated to
# refs/heads/main, and the workflow-level default is read-only.
#
# RELEASE PROTECTION MODEL (review Task 3): VERIFIED repository
# settings show NO tag-protection ruleset and no verifiable
# GitHub-enforced immutable-releases configuration (as of 2026-11-21).
# Immutability is therefore a WORKFLOW-LEVEL convention here, honestly
# documented: releases are created with --latest=false, assets are
# never re-uploaded or deleted, `--clobber` is never used, and any tag
# or release collision fails closed. Enabling GitHub's immutable
# releases feature is an owner decision that would additionally require
# a draft-first sequence change (documented in
# docs/SNAPSHOT_PUBLICATION.md §8) BEFORE it is switched on.

on:
  workflow_dispatch:
    inputs:
      max_pools:
        description: "--max-pools for the filtered discovery corpus (PROPOSED default, NOT yet proven by a live run; an undersized value FAILS the run — raise it until no discovery-completeness failure is reported)"
        required: false
        default: "5000"
      enrich:
        description: "--enrich (PROPOSED default, NOT yet proven by a live run; an undersized value FAILS the run — raise it until no enrichment-completeness failure is reported)"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: publish-console-snapshot
  cancel-in-progress: false # never kill a publication mid-release

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. generate — READ-ONLY preparation (no write permission anywhere)
  # ─────────────────────────────────────────────────────────────────────
  generate:
    name: generate + validate + stage artifact (read-only)
    # Layer 1 of the main-only restriction: a dispatch on any other ref
    # skips this job (and therefore the whole workflow) entirely.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # EXPLICIT job-level grant (fourth-round correction): never rely on
    # organization defaults — the automatic token is READ-ONLY here by
    # declaration.
    permissions:
      contents: read
    env:
      DISCOVERY_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
      DATA_DIR: ./data
      MAX_POOLS: ${{ inputs.max_pools || '5000' }}
      ENRICH: ${{ inputs.enrich || '500' }}
      CHECKOUT_SHA: ${{ github.sha }}
    steps:
      # Layer 2 of the main-only restriction: explicit ref guard.
      - name: Guard — production publication runs ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: ${{ github.sha }} # the EXACT commit Actions selected — never a moving branch head
          submodules: recursive
          fetch-depth: 0 # real git head for the provenance source commit
      - name: Assert the checked-out commit is the workflow's selected commit
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "checked out commit: $ACTUAL"
          if [ "$ACTUAL" != "$CHECKOUT_SHA" ]; then
            echo "checkout mismatch: HEAD ($ACTUAL) != selected commit ($CHECKOUT_SHA) — refusing to generate provenance from an unverified source"
            exit 1
          fi
          echo "provenance source commit will be the actual checked-out commit: $ACTUAL"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # pnpm/action-setup v6
        with:
          version: 9
      - name: Validate dispatch inputs (strict positive integers; no shell injection surface)
        run: |
          for v in "$MAX_POOLS" "$ENRICH"; do
            case "$v" in
              ''|*[!0-9]*) echo "dispatch input must be a positive integer, got: $v"; exit 1 ;;
            esac
            [ "$v" -gt 0 ] || { echo "dispatch input must be > 0, got: $v"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - name: Build vendored SDK (pinned protocol submodule)
        run: pnpm run build:sdk
      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.typecheck.json --noEmit
      - name: Generate + validate + stage the snapshot artifact
        # publish-snapshot FAILS (non-zero) on any schema violation,
        # integrity mismatch or completeness violation — this step is the
        # publication gate; nothing downstream runs if it fails.
        # NOTE: this step receives NO GitHub token — it only needs the
        # RPC secrets above and the git checkout.
        run: |
          node --import tsx/esm src/cli.ts publish-snapshot \
            --max-pools "$MAX_POOLS" \
            --enrich "$ENRICH"
      - name: Verify the staged artifact (independent re-check)
        run: |
          node --import tsx/esm src/cli.ts verify-snapshot \
            data/console-snapshot.json data/console-snapshot-provenance.json
      - name: Upload staged publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: snapshot-publication-bundle
          path: |
            data/console-snapshot.json
            data/console-snapshot-provenance.json
            data/console-snapshot.sha256
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # 2. verify — READ-ONLY independent re-verification + bundle build
  # ─────────────────────────────────────────────────────────────────────
  verify:
    name: independently re-verify staged bundle + build zero-dep release-ops CLI (read-only)
    needs: generate
    # Layer 1 of the main-only restriction.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # EXPLICIT job-level grant: the automatic token is READ-ONLY here by
    # declaration.
    permissions:
      contents: read
    env:
      CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - name: Guard — verification runs ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - name: Download the staged publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: snapshot-publication-bundle
          path: bundle
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: ${{ github.sha }} # same explicit-commit fidelity as the generate job
          submodules: recursive
          fetch-depth: 0
      - name: Assert the checked-out commit is the workflow's selected commit
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$CHECKOUT_SHA" ]; then
            echo "checkout mismatch: HEAD ($ACTUAL) != selected commit ($CHECKOUT_SHA) — refusing to verify against an unverified source"; exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # pnpm/action-setup v6
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:sdk
      - name: Re-verify the downloaded artifact BEFORE any publication (independent of generate)
        run: |
          node --import tsx/esm src/cli.ts verify-snapshot \
            bundle/console-snapshot.json bundle/console-snapshot-provenance.json
      - name: Build the ZERO-DEPENDENCY release-ops bundle (from the asserted commit)
        # src/releaseOpsCli.ts compiles to a single self-contained .mjs
        # whose ONLY imports are `node:` builtins (pinned by
        # test/releaseOpsCliBundle.test.ts). The read-only publish and
        # verify-versioned jobs run THIS prebuilt file with the runner's
        # plain node — never repository source, never a dependency tree.
        run: pnpm run bundle:release-ops
      - name: Upload the release-ops bundle for the read-only gate jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: release-ops-cli
          path: dist/release-ops.mjs
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # 3. publish — READ-ONLY gates + rollback discovery (repository-built
  #    code runs HERE, under an explicit contents:read job grant; the
  #    write-capable token does not exist in this job at all)
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: pre-publication gates + rollback-pointer discovery (read-only)
    needs: [generate, verify]
    # Layer 1 of the main-only restriction.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # EXPLICIT read-only grant: this job runs repository-built code
      # (the release-ops bundle, provenance parsing). `github.token` is
      # therefore READ-ONLY for every step of this job — the write-
      # capable token does not exist here, so the review's finding (a
      # write-capable token reaching custom stable-pointer discovery)
      # is impossible by construction.
      contents: read
    env:
      REPO: ${{ github.repository }}
      # The dedicated stable reference (sixth round) — informational; the
      # repo-wide latest URL is no longer referenced anywhere in the
      # workflow's execution path.
      STABLE_REF: refs/tags/console-snapshot-prod
    steps:
      - name: Guard — the pre-publication gates run ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - name: Download the verified publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: snapshot-publication-bundle
          path: bundle
      - name: Download the prebuilt release-ops bundle (built by the read-only verify job)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: release-ops-cli
          path: ops
      - name: Assert both downloaded artifacts exist (fail closed on a missing artifact)
        run: |
          test -f bundle/console-snapshot.json || { echo "publication bundle incomplete (console-snapshot.json missing)"; exit 1; }
          test -f bundle/console-snapshot-provenance.json || { echo "publication bundle incomplete (provenance missing)"; exit 1; }
          test -f bundle/console-snapshot.sha256 || { echo "publication bundle incomplete (checksum missing)"; exit 1; }
          test -f ops/release-ops.mjs || { echo "release-ops bundle missing — the gate job refuses to run without the verified bundle"; exit 1; }
      - name: Re-check the checksum over the downloaded bytes (pure shell, no repository code)
        # The FIRST publication gate: the three files about to be
        # uploaded must be internally consistent (checksum file over the
        # exact snapshot bytes), verified with runner-preinstalled
        # sha256sum only.
        working-directory: bundle
        run: sha256sum -c console-snapshot.sha256
      - name: Read + validate the versioned tag from the provenance sidecar
        id: facts
        # Runs in a READ-ONLY job: even this inline parse receives no
        # write-capable credential under any circumstance.
        run: |
          TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('bundle/console-snapshot-provenance.json','utf8')).versionedTag)")
          # Strict shape check BEFORE the tag is used in any command: a
          # malformed or hostile sidecar value never reaches a shell or gh.
          case "$TAG" in
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-notrack) ;;
            '') echo "no versioned tag in provenance"; exit 1 ;;
            *) echo "provenance tag fails the strict versioned-tag shape: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "versioned tag: $TAG"
      - name: Fail safely on an existing versioned tag collision (immutability, no clobber)
        # Explicit three-way handling: HTTP 404 = genuinely absent (safe),
        # HTTP 200 = EXISTS (abort), ANY other status = the gate itself
        # failed (network/auth/API) — NEVER interpreted as "absent".
        # FOURTH-ROUND CORRECTION (private repository): the previous
        # unauthenticated `git ls-remote` probe CANNOT work against a
        # private repository (it fails closed, but it can never confirm
        # absence). The gate now queries the REST API with the READ-ONLY
        # workflow token (this job's explicit grant is contents:read) —
        # a query credential, never a write credential.
        env:
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          TAG="${{ steps.facts.outputs.tag }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/$TAG") || { echo "tag-collision gate FAILED (curl transport error); refusing to treat this as 'tag absent'"; exit 1; }
          case "$code" in
            404) echo "versioned tag $TAG does not exist — safe to publish" ;;
            200) echo "versioned tag $TAG already exists — historical versioned releases are immutable; aborting (stable reference untouched)"; exit 1 ;;
            *) echo "tag-collision gate FAILED (unexpected HTTP $code); refusing to treat this as 'tag absent'"; exit 1 ;;
          esac
      - name: Belt check — an existing RELEASE for this tag is also a fail-closed collision
        # Three-way (review Task 4 semantics): HTTP 404 = genuinely
        # absent, HTTP 200 = EXISTS (abort), curl transport failure or
        # any other status = the gate itself failed (abort) — NEVER
        # reinterpreted as "no release". GH_TOKEN here is the READ-ONLY
        # workflow token (this job's permissions grant only
        # contents:read) — a query credential, never a write credential.
        env:
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          TAG="${{ steps.facts.outputs.tag }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG") || { echo "release-collision belt check FAILED (curl transport error); refusing to treat this as 'no release'"; exit 1; }
          case "$code" in
            404) echo "no release exists for tag $TAG — confirmed safe to publish" ;;
            200) echo "a release for tag $TAG already exists — historical versioned releases are immutable; aborting (stable reference untouched)"; exit 1 ;;
            *) echo "release-collision belt check got unexpected HTTP $code; refusing to treat this as 'no release'"; exit 1 ;;
          esac
      - name: Record the current stable pointer (rollback reference; aborts on ANY discovery failure)
        # Hardened (review Task 4; sixth round): `stable-pointer-current`
        # reads the DEDICATED stable reference
        # (refs/tags/console-snapshot-prod) — NOT the repo-wide latest
        # designation — and exits non-zero on authentication failure,
        # permission failure, rate limit, API outage, network failure or
        # malformed response. Only a genuine HTTP 404 yields kind=none
        # ("first publication"). The pointer is recorded BEFORE any
        # release operation and written to the run summary immediately,
        # so even a failed run shows the exact rollback target.
        # CREDENTIAL NOTE (review Task 1, third-round correction): this
        # is repository-built custom code, so it receives the READ-ONLY
        # workflow token ONLY — this job's explicit permissions grant is
        # contents:read, making a write-capable token unreachable here
        # through env, shell expansion, process arguments or the
        # github.token context alike.
        id: rollback
        env:
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          node ops/release-ops.mjs stable-pointer-current "$REPO" > /tmp/rollback.out
          kind=$(sed -n 's/^kind=//p' /tmp/rollback.out)
          tag=$(sed -n 's/^tag=//p' /tmp/rollback.out)
          sha=$(sed -n 's/^sha=//p' /tmp/rollback.out)
          pointer_json=$(sed -n 's/^pointer_json=//p' /tmp/rollback.out)
          if [ "$kind" = "found" ]; then PREV="$tag"; else PREV=""; fi
          echo "previous stable pointer: ${PREV:-<none — first publication>}"
          echo "previous_versioned_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous_pointer_json=$pointer_json" >> "$GITHUB_OUTPUT"
          {
            echo "## Rollback pointer (recorded BEFORE any release operation)"
            echo "- previous stable pointer target: \`${PREV:-<none — first publication>}\`"
            if [ -n "$pointer_json" ]; then
              echo "- previous pointer JSON (recorded verbatim for rollback):"
              echo '```json'
              echo "$pointer_json"
              echo '```'
            fi
            echo "- to restore it after activation: re-create the previous pointer tag object (\`gh api POST /git/tags\` with the recorded pointer JSON as the message) and move \`refs/tags/console-snapshot-prod\` to it (\`gh api PATCH /git/refs\`) — the workflow's rollback step does exactly this and verifies the result"
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      versioned_tag: ${{ steps.facts.outputs.tag }}
      previous_versioned_tag: ${{ steps.rollback.outputs.previous_versioned_tag }}
      previous_pointer_json: ${{ steps.rollback.outputs.previous_pointer_json }}

  # ─────────────────────────────────────────────────────────────────────
  # 4. release — PRIVILEGED but ZERO CUSTOM CODE: the only job that
  #    creates the versioned release. The automatic GITHUB_TOKEN stays
  #    READ-ONLY (explicit contents:read); the ONLY write-capable
  #    credential is the owner-provisioned `GY_RELEASE_PAT` secret,
  #    attached as step-level env to the pinned `gh release` mutation
  #    step alone. Every other step is a token-free precondition (or an
  #    authenticated READ gate using the automatic token). No node, no
  #    repository script, no downloaded-code execution.
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: create + upload the immutable versioned release (privileged — trusted gh operations only, no custom code)
    needs: publish
    # Layer 1 of the main-only restriction on the release-writing job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # FOURTH-ROUND CORRECTION: the automatic GITHUB_TOKEN is READ-ONLY
      # even here. The release mutations authenticate with the dedicated
      # fine-grained `GY_RELEASE_PAT` secret (step-level env on the
      # mutation step ONLY), so the job-level grant never needs
      # contents: write — a write-capable automatic token does not exist
      # in ANY job of this workflow.
      contents: read
    env:
      # NOTE: no GH_TOKEN and no GY_RELEASE_PAT at job level — the write
      # credential exists ONLY as the step-level env of the `gh release`
      # mutation step below. This job contains NO checkout, NO
      # setup-node, NO pnpm, NO dependency installation, NO node
      # invocation and NO repository-built or artifact-executed code:
      # nothing here can reach the privileged credential except the
      # pinned gh release-mutation command itself.
      REPO: ${{ github.repository }}
      CHECKOUT_SHA: ${{ github.sha }} # the commit asserted by generate/verify
    steps:
      - name: Guard — release-writing steps run ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to publish: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - name: Download the verified publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: snapshot-publication-bundle
          path: bundle
      - name: Assert the downloaded bundle is complete (fail closed on a missing artifact)
        run: |
          test -f bundle/console-snapshot.json || { echo "publication bundle incomplete (console-snapshot.json missing)"; exit 1; }
          test -f bundle/console-snapshot-provenance.json || { echo "publication bundle incomplete (provenance missing)"; exit 1; }
          test -f bundle/console-snapshot.sha256 || { echo "publication bundle incomplete (checksum missing)"; exit 1; }
      - name: Re-check the checksum over the downloaded bytes (pure shell, no repository code)
        # The privileged job's LAST line of defense before anything is
        # published: the three files it is about to upload must be
        # internally consistent, verified with runner-preinstalled
        # sha256sum only. No token exists on this step.
        working-directory: bundle
        run: sha256sum -c console-snapshot.sha256
      - name: Re-validate the versioned tag crossing the job boundary
        # The tag arrives as a job output from the read-only publish
        # job (where it was parsed from provenance and strictly shape-
        # validated); it is validated AGAIN here, before any privileged
        # command consumes it. Token-free.
        env:
          TAG: ${{ needs.publish.outputs.versioned_tag }}
        run: |
          case "$TAG" in
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-notrack) ;;
            '') echo "no versioned tag crossed the job boundary"; exit 1 ;;
            *) echo "tag crossing into the privileged job fails the strict versioned-tag shape: $TAG"; exit 1 ;;
          esac
      - name: Fail safely on an existing versioned tag collision (immutability, no clobber)
        # Re-run IMMEDIATELY before the mutation (three-way semantics as
        # in the publish job): HTTP 404 = genuinely absent (safe), HTTP
        # 200 = EXISTS (abort), ANY other status = the gate itself failed
        # (abort). Authenticated with the READ-ONLY automatic token (the
        # unauthenticated ls-remote probe cannot resolve a private
        # repository) — a query credential, never the release-write PAT.
        env:
          TAG: ${{ needs.publish.outputs.versioned_tag }}
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/$TAG") || { echo "tag-collision gate FAILED (curl transport error); refusing to treat this as 'tag absent'"; exit 1; }
          case "$code" in
            404) echo "versioned tag $TAG does not exist — safe to publish" ;;
            200) echo "versioned tag $TAG already exists — historical versioned releases are immutable; aborting (stable reference untouched)"; exit 1 ;;
            *) echo "tag-collision gate FAILED (unexpected HTTP $code); refusing to treat this as 'tag absent'"; exit 1 ;;
          esac
      - name: Publish the immutable versioned release (explicitly NOT latest)
        # `--latest=false` pins the stable pointer: the release must NOT
        # become the stable reference on creation. Assets are uploaded in
        # a separate command (required for --latest=false to hold).
        # Release creation (422 on any collision) and upload failures
        # abort the run BEFORE activation — the previous release keeps
        # serving the stable URL throughout.
        # THE write-capable credential exists ONLY here: the dedicated
        # fine-grained `GY_RELEASE_PAT` repository secret, scoped to
        # THIS step's env. The automatic GITHUB_TOKEN is read-only and
        # is NOT used for the mutation. The PAT reaches only this pinned
        # gh CLI invocation — never node, never a script, never an
        # action, never a downloaded artifact.
        env:
          TAG: ${{ needs.publish.outputs.versioned_tag }}
          GH_TOKEN: ${{ secrets.GY_RELEASE_PAT }} # dedicated release-write credential, scoped to this step only
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$CHECKOUT_SHA" \
            --latest=false \
            --title "ConsoleSnapshot v2 — $TAG" \
            --notes "Schema-v2 console snapshot (M1 WSOL quote-side sourcing). Immutable versioned publication: generation timestamp + source commit are encoded in the tag. Assets: console-snapshot.json, console-snapshot-provenance.json, console-snapshot.sha256. This release becomes the stable production artifact only after its assets are verified through the authenticated path and the dedicated console-snapshot-prod stable reference is atomically moved to its pointer."
          gh release upload "$TAG" \
            --repo "$REPO" \
            bundle/console-snapshot.json \
            bundle/console-snapshot-provenance.json \
            bundle/console-snapshot.sha256
    outputs:
      versioned_tag: ${{ needs.publish.outputs.versioned_tag }}

  # ─────────────────────────────────────────────────────────────────────
  # 5. verify-versioned — READ-ONLY same-release roundtrip gate BETWEEN
  #    upload and promotion. The gate authenticates with the READ-ONLY
  #    automatic token (a private repository's release assets 404 for
  #    unauthenticated requests); it receives NO release-write
  #    credential. The stable pointer cannot move until this job is
  #    green.
  # ─────────────────────────────────────────────────────────────────────
  verify-versioned:
    name: verify the released assets of THIS exact versioned release, before promotion (read-only)
    needs: release
    # Layer 1 of the main-only restriction.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # EXPLICIT job-level grant: the automatic token is READ-ONLY here by
    # declaration.
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Guard — the roundtrip gate runs ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - name: Download the prebuilt release-ops bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: release-ops-cli
          path: ops
      - name: Assert the release-ops bundle exists (fail closed)
        run: |
          test -f ops/release-ops.mjs || { echo "release-ops bundle missing — the roundtrip gate refuses to run without the verified bundle"; exit 1; }
      - name: Re-validate the versioned tag crossing the job boundary
        env:
          TAG: ${{ needs.release.outputs.versioned_tag }}
        run: |
          case "$TAG" in
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-notrack) ;;
            '') echo "no versioned tag crossed the job boundary"; exit 1 ;;
            *) echo "tag crossing into the roundtrip gate fails the strict versioned-tag shape: $TAG"; exit 1 ;;
          esac
      - name: Verify the versioned release's OWN assets (same-release cross-check, authenticated API path)
        # Review Task 5: all three assets are verified against the EXACT
        # versioned release — checksum over the exact snapshot bytes,
        # provenance digest over the bytes, and the provenance sidecar
        # must NAME this release's tag, so a mixed artifact set (files
        # resolved from different releases) can never pass.
        # CREDENTIAL NOTE (fourth-round correction): the repository is
        # PRIVATE, so the release record and its assets are unreachable
        # unauthenticated — the gate authenticates with the READ-ONLY
        # automatic workflow token (this job declares contents:read). It
        # receives NO release-write credential, and it holds no write
        # permission, so promotion (the next job) is unreachable until
        # this verification has passed.
        env:
          TAG: ${{ needs.release.outputs.versioned_tag }}
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          node ops/release-ops.mjs verify-release-assets \
            "$REPO" --tag "$TAG" --scope versioned --expected-tag "$TAG"
      - name: Build the stable-pointer JSON from the VERIFIED release (read-only preparation for activation)
        # Sixth round: after the same-release verification passes, the
        # bundle builds the stable-pointer JSON from the EXACT verified
        # bytes (per-asset SHA-256 digests + the release's source commit)
        # and resolves the CURRENT stable pointer as the rollback
        # reference. This step is strictly READ-ONLY — it only PRODUCES
        # the pointer JSON; the ref mutation happens exclusively in the
        # privileged promote job's pinned `gh api` steps.
        id: pointer
        env:
          TAG: ${{ needs.release.outputs.versioned_tag }}
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          node ops/release-ops.mjs stable-pointer-build \
            "$REPO" --tag "$TAG" --expected-tag "$TAG" > /tmp/pointer.out
          pointer_json=$(sed -n 's/^pointer_json=//p' /tmp/pointer.out)
          prev_kind=$(sed -n 's/^previous_kind=//p' /tmp/pointer.out)
          prev_tag=$(sed -n 's/^previous_versioned_tag=//p' /tmp/pointer.out)
          prev_sha=$(sed -n 's/^previous_tag_object_sha=//p' /tmp/pointer.out)
          # Fail closed on an empty pointer (the build must have produced one).
          if [ -z "$pointer_json" ]; then
            echo "stable-pointer-build produced no pointer JSON"; exit 1
          fi
          echo "pointer_json=$pointer_json" >> "$GITHUB_OUTPUT"
          echo "previous_kind=$prev_kind" >> "$GITHUB_OUTPUT"
          echo "previous_versioned_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag_object_sha=$prev_sha" >> "$GITHUB_OUTPUT"
          echo "stable pointer built for $TAG (previous: ${prev_tag:-<none — first publication>})"
    outputs:
      versioned_tag: ${{ needs.release.outputs.versioned_tag }}
      pointer_json: ${{ steps.pointer.outputs.pointer_json }}
      build_previous_versioned_tag: ${{ steps.pointer.outputs.previous_versioned_tag }}

  # ─────────────────────────────────────────────────────────────────────
  # 6. promote — PRIVILEGED activation of the DEDICATED stable reference
  #    (refs/tags/console-snapshot-prod): the new ANNOTATED tag object is
  #    created and the ref is moved with ONE atomic update, authenticated
  #    with the dedicated `GY_RELEASE_PAT` secret on the mutation and
  #    rollback steps' env alone. Zero custom code, no checkout, no node
  #    (only pinned `gh api`, `curl`, `jq` and shell validation); the
  #    automatic GITHUB_TOKEN stays READ-ONLY (explicit contents:read)
  #    and is used ONLY for the read-only gates and the read-back
  #    verification. Runs only after the roundtrip gate (verify-versioned)
  #    proved the released bytes and built the pointer JSON.
  # ─────────────────────────────────────────────────────────────────────
  promote:
    name: activate the dedicated stable reference — new annotated pointer tag object + ONE atomic ref update (privileged — pinned gh api mutations only, no custom code)
    needs: verify-versioned
    # Layer 1 of the main-only restriction on the promotion job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # SIXTH-ROUND CORRECTION: the automatic GITHUB_TOKEN is READ-ONLY
      # even here; the ref mutations authenticate through the dedicated
      # `GY_RELEASE_PAT` secret (step-level env below), so no job-level
      # write grant is needed anywhere in this workflow.
      contents: read
    env:
      REPO: ${{ github.repository }}
      CHECKOUT_SHA: ${{ github.sha }}
      STABLE_REF: refs/tags/console-snapshot-prod
    steps:
      - name: Guard — the promotion runs ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to promote: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - name: Re-validate the versioned tag crossing the job boundary
        env:
          TAG: ${{ needs.verify-versioned.outputs.versioned_tag }}
        run: |
          case "$TAG" in
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-notrack) ;;
            '') echo "no versioned tag crossed the job boundary"; exit 1 ;;
            *) echo "tag crossing into the promotion job fails the strict versioned-tag shape: $TAG"; exit 1 ;;
          esac
      - name: Validate the pointer JSON crossing the job boundary (token-free)
        # The pointer JSON was built by the read-only verify-versioned job
        # from the VERIFIED release bytes. Before any privileged command
        # consumes it, its shape is re-validated HERE with jq: exact key
        # set, schema discriminator, stable-ref name, versioned tag equal
        # to the boundary tag, source commit equal to the asserted
        # checkout commit, 64-hex digests, positive lengths.
        env:
          TAG: ${{ needs.verify-versioned.outputs.versioned_tag }}
          POINTER_JSON: ${{ needs.verify-versioned.outputs.pointer_json }}
        run: |
          if [ -z "$POINTER_JSON" ]; then echo "no pointer JSON crossed the job boundary"; exit 1; fi
          jq -e '
            (keys | sort) == (["checksum","pointerSchema","previousTagObjectSha","previousVersionedTag","provenance","publishedAtUnixMs","snapshot","sourceCommit","stableRef","versionedTag"] | sort)
            and .pointerSchema == "graveyield.console-snapshot-stable-pointer.v1"
            and .stableRef == "console-snapshot-prod"
            and .versionedTag == $tag
            and .sourceCommit == $commit
            and (.publishedAtUnixMs | type == "number" and . > 0)
            and .snapshot.name == "console-snapshot.json"
            and .provenance.name == "console-snapshot-provenance.json"
            and .checksum.name == "console-snapshot.sha256"
            and ([.snapshot.sha256, .provenance.sha256, .checksum.sha256] | all(test("^[0-9a-f]{64}$")))
            and ([.snapshot.byteLength, .provenance.byteLength, .checksum.byteLength] | all(type == "number" and . > 0))
            and ((.previousVersionedTag == null) == (.previousTagObjectSha == null))
          ' --arg tag "$TAG" --arg commit "$CHECKOUT_SHA" >/dev/null <<<"$POINTER_JSON" \
            || { echo "pointer JSON crossing into the promotion job fails the strict pointer validation"; exit 1; }
          echo "pointer JSON validated: names $TAG at commit $CHECKOUT_SHA"
      - name: Read the current stable reference (three-way gate; records the rollback reference)
        # Immediately before the mutation, the current state of
        # refs/tags/console-snapshot-prod is re-read with the READ-ONLY
        # automatic token: 404 = absent (first publication, mode=create),
        # 200 = exists (mode=update; the pointer JSON in the tag object is
        # validated and recorded verbatim as the rollback reference),
        # anything else = the gate itself failed (abort). This fresh read
        # is the authoritative rollback source; the build-time read from
        # verify-versioned is recorded for the summary.
        id: stablegate
        env:
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          code=$(curl -sS -o /tmp/stableref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod") || { echo "stable-ref gate FAILED (curl transport error); refusing to treat this as 'ref absent'"; exit 1; }
          case "$code" in
            404)
              echo "the stable ref does not exist yet — first publication (mode=create)"
              echo "ref_mode=create" >> "$GITHUB_OUTPUT"
              echo "previous_pointer_json=" >> "$GITHUB_OUTPUT"
              echo "previous_versioned_tag=" >> "$GITHUB_OUTPUT"
              echo "previous_tag_object_sha=" >> "$GITHUB_OUTPUT"
              ;;
            200)
              sha=$(jq -r '.object.sha' /tmp/stableref.json)
              case "$sha" in
                [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
                *) echo "stable-ref gate returned an unusable object.sha: $sha"; exit 1 ;;
              esac
              curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/git/tags/$sha" -o /tmp/stableobj.json \
                || { echo "stable tag-object read FAILED (curl transport error); aborting"; exit 1; }
              message=$(jq -r '.message // ""' /tmp/stableobj.json)
              prev_tag=$(jq -r '.versionedTag // ""' <<<"$message")
              case "$prev_tag" in
                console-snapshot-prod-*) ;;
                *) echo "the current stable tag object does not carry a valid pointer JSON — refusing to activate on top of an unparseable state"; exit 1 ;;
              esac
              echo "the stable ref exists and names ${prev_tag} (mode=update)"
              echo "ref_mode=update" >> "$GITHUB_OUTPUT"
              echo "previous_pointer_json=$message" >> "$GITHUB_OUTPUT"
              echo "previous_versioned_tag=$prev_tag" >> "$GITHUB_OUTPUT"
              echo "previous_tag_object_sha=$sha" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "stable-ref gate FAILED (unexpected HTTP $code); refusing to treat this as 'ref absent'"; exit 1 ;;
          esac
      - name: Mark the activation start (the rollback gate — written immediately BEFORE the first mutation)
        # SEVENTH-ROUND CORRECTION: the rollback step below previously ran
        # on `if: failure()`, which also fired when an earlier gate (the
        # three-way stable-ref read, the pointer re-validation) failed —
        # i.e. when activation was never attempted and the ref was never
        # touched. The rollback must run ONLY when activation was
        # actually ATTEMPTED. This step writes the marker immediately
        # before the privileged mutation step; every gate that precedes
        # it can fail the run without triggering a rollback. Because the
        # marker precedes the mutation, a timed-out or interrupted
        # activation request (which GitHub may nevertheless have applied)
        # still yields activation_started=true — the rollback is
        # attempted even though the activation step reports failure or
        # was killed mid-request.
        id: activation_gate
        run: echo "activation_started=true" >> "$GITHUB_OUTPUT"
      - name: Activate the dedicated stable reference (create annotated pointer tag object + ONE atomic ref update)
        # Only reached when: artifact complete + schema-valid + integrity
        # verified + versioned release published + same-release asset
        # verification passed (verify-versioned is this job's `needs`) +
        # pointer JSON re-validated + current ref state read. The pointer
        # JSON becomes the message of a NEW immutable annotated tag
        # object; the ref then moves in ONE atomic update. No asset is
        # ever deleted or overwritten, so the previous last-known-good
        # artifact remains fully available (its versioned release is
        # untouched) and a failure here leaves the OLD pointer serving.
        # THE write-capable credential exists ONLY on this step (and the
        # rollback step below): the dedicated fine-grained
        # `GY_RELEASE_PAT` repository secret. The automatic GITHUB_TOKEN
        # is read-only and is NOT used for the mutations; the PAT reaches
        # only these pinned gh api invocations — never node, never a
        # script, never an action, never a downloaded artifact.
        id: activate
        env:
          TAG: ${{ needs.verify-versioned.outputs.versioned_tag }}
          POINTER_JSON: ${{ needs.verify-versioned.outputs.pointer_json }}
          REF_MODE: ${{ steps.stablegate.outputs.ref_mode }}
          GH_TOKEN: ${{ secrets.GY_RELEASE_PAT }} # dedicated release-write credential, scoped to this step only
        run: |
          new_sha=$(gh api --method POST "repos/$REPO/git/tags" \
            -f tag="console-snapshot-prod" \
            -f object="$CHECKOUT_SHA" \
            -f type="commit" \
            -f message="$POINTER_JSON" \
            --jq '.sha')
          case "$new_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "tag-object creation returned no usable sha: $new_sha"; exit 1 ;;
          esac
          echo "new_tag_object_sha=$new_sha" >> "$GITHUB_OUTPUT"
          if [ "$REF_MODE" = "create" ]; then
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="$STABLE_REF" \
              -f sha="$new_sha"
          else
            # SEVENTH-ROUND CORRECTION: the ref-update endpoint must be
            # repository-qualified. A bare ref is not a GitHub API path —
            # the PATCH must address
            # repos/<repo>/git/refs/tags/console-snapshot-prod.
            gh api --method PATCH "repos/$REPO/git/refs/tags/console-snapshot-prod" \
              -f sha="$new_sha" \
              -F force=true
          fi
          echo "stable ref activation issued: $STABLE_REF -> $new_sha (pointer for $TAG)"
      - name: Read-back verification (the ref MUST name the created pointer object)
        # READ-ONLY (automatic token): the ref must now resolve to exactly
        # the created tag object sha, and that object's message must equal
        # the pointer JSON byte-for-byte. Any divergence fails the run and
        # triggers the rollback step below.
        id: readback
        if: success()
        env:
          POINTER_JSON: ${{ needs.verify-versioned.outputs.pointer_json }}
          NEW_SHA: ${{ steps.activate.outputs.new_tag_object_sha }}
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job grants contents:read only), scoped to this step
        run: |
          sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod" | jq -r '.object.sha // ""')
          if [ "$sha" != "$NEW_SHA" ]; then
            echo "READ-BACK MISMATCH: the stable ref resolves to '$sha', expected the created object '$NEW_SHA'"
            exit 1
          fi
          message=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/tags/$NEW_SHA" | jq -r '.message // ""')
          if [ "$message" != "$POINTER_JSON" ]; then
            echo "READ-BACK MISMATCH: the activated tag object's message does not equal the validated pointer JSON"
            exit 1
          fi
          echo "read-back verified: refs/tags/console-snapshot-prod -> $NEW_SHA (pointer for ${{ needs.verify-versioned.outputs.versioned_tag }})"
      - name: Roll back the stable reference to the recorded previous pointer (only when activation was ATTEMPTED and failed)
        # SEVENTH-ROUND CORRECTION: runs ONLY when (a) the run has failed
        # AND (b) the activation-start marker exists — i.e. the workflow
        # passed every pre-activation gate and reached the privileged
        # mutation. Failures BEFORE activation (artifact gates, pointer
        # validation, the three-way stable-ref gate) never run the
        # rollback, because the stable ref was never touched. Failures
        # AT or AFTER activation — including an activation request that
        # timed out or was interrupted after GitHub may have applied the
        # ref update (the marker is written before the mutation) — DO run
        # the rollback. Restores the recorded previous pointer: for a
        # first publication (no previous pointer) it DELETES the ref via
        # the repository-qualified endpoint (restoring the absent state);
        # otherwise it re-creates a tag object carrying the PREVIOUS
        # pointer JSON verbatim and re-points the ref to it. Every
        # mutation addresses the COMPLETE repository-qualified API path
        # repos/<repo>/git/refs/tags/console-snapshot-prod. The result is
        # verified by read-back. ANY rollback failure fails LOUDLY with
        # the stable state reported as UNVERIFIED — the run NEVER claims
        # restoration without evidence (an auth failure, network error,
        # rate limit or unexpected API response is never treated as proof
        # that the ref is absent).
        if: failure() && steps.activation_gate.outputs.activation_started == 'true'
        env:
          REF_MODE: ${{ steps.stablegate.outputs.ref_mode }}
          PREV_POINTER_JSON: ${{ steps.stablegate.outputs.previous_pointer_json }}
          PREV_VERSIONED_TAG: ${{ steps.stablegate.outputs.previous_versioned_tag }}
          GH_TOKEN: ${{ secrets.GY_RELEASE_PAT }} # dedicated release-write credential, scoped to this step only
        run: |
          set +e
          rollback_ok=false
          if [ "$REF_MODE" = "create" ]; then
            echo "first publication: rolling back to the ABSENT stable-ref state (deleting the ref)"
            # Errors are NOT suppressed: they appear in the run log so an
            # UNVERIFIED outcome carries the API's own failure detail. The
            # `|| true` only prevents an early abort before the read-back
            # below can determine the actual ref state.
            gh api --method DELETE "repos/$REPO/git/refs/tags/console-snapshot-prod" || true
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod")
            if [ "$code" = "404" ]; then
              rollback_ok=true
              echo "rollback VERIFIED: the stable ref is absent again (first-publication state restored)"
            else
              echo "rollback verification FAILED: the stable ref read returned HTTP $code (expected 404)"
            fi
          else
            echo "rolling back to the recorded previous pointer (${PREV_VERSIONED_TAG})"
            prev_commit=$(jq -r '.sourceCommit // ""' <<<"$PREV_POINTER_JSON")
            case "$prev_commit" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
              *) echo "the recorded previous pointer carries no usable sourceCommit — refusing a blind rollback"; prev_commit="" ;;
            esac
            if [ -n "$prev_commit" ]; then
              old_sha=$(gh api --method POST "repos/$REPO/git/tags" \
                -f tag="console-snapshot-prod" \
                -f object="$prev_commit" \
                -f type="commit" \
                -f message="$PREV_POINTER_JSON" \
                --jq '.sha')
              gh api --method PATCH "repos/$REPO/git/refs/tags/console-snapshot-prod" -f sha="$old_sha" -F force=true || true
              sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/git/ref/tags/console-snapshot-prod" | jq -r '.object.sha // ""')
              message=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/git/tags/$sha" | jq -r '.message // ""')
              restored_tag=$(jq -r '.versionedTag // ""' <<<"$message")
              if [ "$sha" = "$old_sha" ] && [ "$message" = "$PREV_POINTER_JSON" ] && [ "$restored_tag" = "$PREV_VERSIONED_TAG" ]; then
                rollback_ok=true
                echo "rollback VERIFIED: the stable ref again resolves to ${PREV_VERSIONED_TAG} (tag object $old_sha)"
              else
                echo "rollback verification FAILED: ref=$sha expected=$old_sha; restored tag='${restored_tag}' expected='${PREV_VERSIONED_TAG}'"
              fi
            fi
          fi
          if [ "$rollback_ok" != "true" ]; then
            echo "==================================================================="
            echo "ROLLBACK FAILED — the stable reference state is UNVERIFIED."
            echo "Manual restoration required: re-create the previous pointer tag"
            echo "object from the recorded JSON (see the run summary) and move"
            echo "refs/tags/console-snapshot-prod to it, then re-verify."
            echo "==================================================================="
            exit 1
          fi
    outputs:
      versioned_tag: ${{ needs.verify-versioned.outputs.versioned_tag }}

  # ─────────────────────────────────────────────────────────────────────
  # 7. verify-stable — READ-ONLY post-activation stable-reference gate
  # ─────────────────────────────────────────────────────────────────────
  verify-stable:
    name: post-activation stable-reference gate (read-only)
    needs: [publish, promote]
    # Layer 1 of the main-only restriction.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # EXPLICIT job-level grant: the automatic token is READ-ONLY here by
    # declaration.
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
      CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - name: Guard — the post-activation gate runs ONLY from refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "refusing to run: production publication is restricted to refs/heads/main (got: $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Assert the checked-out commit is the workflow's selected commit
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$CHECKOUT_SHA" ]; then
            echo "checkout mismatch: HEAD ($ACTUAL) != selected commit ($CHECKOUT_SHA)"; exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # pnpm/action-setup v6
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:sdk
      - name: Verify the stable reference serves the activated artifact (post-activation identity gate)
        # Sixth round: the post-activation gate verifies the FULL identity
        # chain over the DEDICATED stable reference
        # (refs/tags/console-snapshot-prod): ref → annotated tag object →
        # pointer JSON → pointer.versionedTag must equal the activated
        # tag → the release record for THAT tag carries THAT tag → the
        # three assets fetched FROM THAT EXACT RECORD (authenticated API
        # path — a private repository's release assets 404 for
        # unauthenticated requests) → checksum + provenance + integrity →
        # pointer digests over the fetched bytes. A raced ref, an
        # unexpected pointer target, a mixed artifact set or a digest
        # divergence FAILS the run (the promote job's rollback step
        # restores the previous pointer). This is a READ-ONLY job: it
        # runs the reviewed commit's own verification code with the
        # workflow's READ-ONLY token — no write permission and no
        # release-write credential exists in this job at all.
        env:
          TAG: ${{ needs.publish.outputs.versioned_tag }}
          GH_TOKEN: ${{ github.token }} # READ-ONLY token (job declares contents: read)
        run: |
          case "$TAG" in
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            console-snapshot-prod-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z-notrack) ;;
            *) echo "activated tag fails the strict versioned-tag shape: $TAG"; exit 1 ;;
          esac
          node --import tsx/esm src/cli.ts verify-stable \
            "$REPO" --expected-tag "$TAG"
          echo "stable reference verified: the dedicated console-snapshot-prod ref resolves to ONE verified artifact set naming exactly the activated versioned release"
      - name: Publication summary (includes rollback pointer)
        # Read-only informational summary. The provenance is read from
        # the run-scoped artifact (no token needed); the rollback pointer
        # crossed the job boundary as a validated job output.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4
        with:
          name: snapshot-publication-bundle
          path: bundle
      - name: Write the publication summary
        env:
          TAG: ${{ needs.publish.outputs.versioned_tag }}
          PREV: ${{ needs.publish.outputs.previous_versioned_tag }}
          PREV_POINTER: ${{ needs.publish.outputs.previous_pointer_json }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## ConsoleSnapshot publication"
            echo "- versioned release: \`$TAG\`"
            echo "- stable reference: the DEDICATED \`refs/tags/console-snapshot-prod\` annotated pointer tag (owner-selected architecture; the repo-wide latest designation is NOT the production pointer)"
            echo "- production resolution: \`GET /repos/$REPO/git/ref/tags/console-snapshot-prod\` → \`GET /repos/$REPO/git/tags/<object.sha>\` → pointer JSON in the tag-object message → fetch assets from \`releases/download/<pointer.versionedTag>/<asset>\` and verify the pointer's SHA-256 digests"
            echo "- rollback pointer (previous stable target): \`${PREV:-<none — first publication>}\`"
            if [ -n "$PREV_POINTER" ]; then
              echo "- previous pointer JSON (recorded verbatim for rollback):"
              echo '```json'
              echo "$PREV_POINTER"
              echo '```'
            fi
            echo "- rollback procedure: re-create the previous pointer tag object (\`gh api POST /git/tags\` with the recorded pointer JSON as the message) and move \`refs/tags/console-snapshot-prod\` to it (\`gh api PATCH /git/refs\`, force), then re-run \`verify-stable --expected-tag <previous tag>\` to confirm"
            echo "- Console configuration (REQUIRES the documented Console-side change — see docs/SNAPSHOT_PUBLICATION.md §9/§13): the Console must resolve the dedicated stable reference through the two-step chain above; \`GY_SNAPSHOT_URL\` (single-GET of the latest URL) no longer matches the production mechanism"
            echo
            echo '```json'
            cat bundle/console-snapshot-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
